name: Helix CI
permissions:
  contents: read
on:
  push:
    paths: ["**", ".github/workflows/ci.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["**", ".github/workflows/ci.yml"]
jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan-ubsan]
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: helix-${{ matrix.preset }}
      - run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ${{ matrix.preset == 'release' && '-DHELIX_ENABLE_AVX2=ON -DHELIX_ENABLE_AVX512=ON' || '' }}
      - run: cmake --build --preset ${{ matrix.preset }} -j 4
      - run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - if: matrix.preset == 'release'
        run: ./build/release/helix_bench kernel 1000 && ./build/release/helix_ipc_bench
  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: helix-tsan
      - run: cmake --preset tsan
      - run: cmake --build --preset tsan -j 4
      - run: ctest --preset tsan --output-on-failure
  clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: helix-clang
      - run: cmake -S . -B build/clang -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build build/clang -j 4 && ctest --test-dir build/clang --output-on-failure
  package:
    runs-on: ubuntu-latest
    needs: [build-test, tsan, clang]
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset release -DHELIX_ENABLE_AVX2=ON -DHELIX_ENABLE_AVX512=ON && cmake --build --preset release -j 4
      - run: cmake --install build/release --prefix "$PWD/_install"
      - name: Verify installed consumer
        run: |
          cmake -S tests/package_consumer -B build/consumer -G Ninja -DCMAKE_PREFIX_PATH="$PWD/_install"
          cmake --build build/consumer
          ./build/consumer/helix_consumer
      - run: cpack --config build/release/CPackConfig.cmake -B _packages
      - run: dpkg-deb --info _packages/*.deb && dpkg-deb --contents _packages/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: helix-${{ github.sha }}
          path: |
            _packages/*.deb
            _packages/*.tar.gz
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: helix-${{ github.sha }}
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
